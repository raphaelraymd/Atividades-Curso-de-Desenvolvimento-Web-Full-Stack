<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tela de login tailwind</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-b from-white to-gray-900">
    <div class="min-h-screen flex justify-center items-center">
        <div class="bg-gradient-to-b from-gray-350 to-white p-8 rounded-lg shadow-lg w-80">
            <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">
                Login
            </h1>
            <div class="mb-4">
                <label class="block mb-2 font-bold">
                    Email
                </label>
                <input type="email" class="w-full border rounded p-2" placeholder="Digite seu email">
            </div>

            <div class="mb-4">
                <label class="block mb-2 font-bold">
                    Senha
                </label>
                <input type="password" class="w-full border rounded p-2" placeholder="Digite sua senha">
            </div>
            <button class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
                Entrar
            </button>

        </div>

    </div>


    </div>
</body>

</html>
